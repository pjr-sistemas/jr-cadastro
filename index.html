<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0A0A0A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>JR Cadastro</title>
<link rel="manifest" href="manifest.json"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0A0A0A;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
:root{
  --bronze:#CD7F32;--prata:#A8A9AD;--ouro:#FFD700;
  --gold:#C9A84C;--gold-l:#E8C96B;
  --bg:#0A0A0A;--card:#141414;--card2:#1C1C1C;--border:#2A2A2A;
  --text:#FFFFFF;--muted:#888888;--accent:#3b82f6;
  --green:#43A047;--red:#E53935;--yellow:#eab308;
}

/* LOGIN */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
  background:radial-gradient(ellipse at top,#1a1400 0%,#0A0A0A 70%);
}
#login-screen img.login-logo{width:180px;margin-bottom:24px}
#login-screen h1{font-size:1.4rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;text-align:center}
#login-screen p.login-sub{color:var(--muted);font-size:.85rem;margin-bottom:28px;text-align:center}
.role-btns{display:flex;gap:12px;margin-bottom:20px;width:100%;max-width:340px}
.role-btn{
  flex:1;padding:13px 16px;border-radius:10px;border:2px solid var(--border);
  background:var(--card);color:var(--muted);font-size:.92rem;cursor:pointer;
  transition:all .2s;text-align:center;font-weight:600;
}
.role-btn.active{border-color:var(--gold);color:var(--gold);background:#1e1600}
.login-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.login-box input{
  padding:14px 16px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card2);color:var(--text);font-size:1rem;outline:none;
  transition:.2s;width:100%;
}
.login-box input:focus{border-color:var(--gold)}
.btn-gold{
  padding:14px;border-radius:10px;border:none;
  background:var(--gold);color:#0A0A0A;font-size:1rem;font-weight:700;
  cursor:pointer;transition:background .2s;width:100%;
}
.btn-gold:hover{background:var(--gold-l)}
.login-err{color:var(--red);font-size:.85rem;text-align:center;min-height:18px}
.falcioni-footer{margin-top:36px;opacity:.3}
.falcioni-footer img{height:24px}
input[type=password],input[type=text],input[type=number]{
  background:var(--card2);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-size:15px;padding:12px 14px;width:100%;
  outline:none;transition:.2s
}
input:focus{border-color:var(--gold)}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;flex-direction:column}
.header-title{font-size:17px;font-weight:700;color:#fff}
.header-sub{font-size:12px;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:10px}
.btn-lock{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 10px;cursor:pointer;font-size:16px;transition:.2s}
.btn-lock:hover{border-color:var(--accent);color:var(--accent)}
.btn-logout{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;padding:4px}
.btn-logout:hover{color:var(--red)}

/* MÊS HEADER */
.mes-bar{background:var(--card2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.mes-nav{display:flex;align-items:center;gap:12px}
.btn-mes{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 10px;cursor:pointer;font-size:18px;transition:.2s}
.btn-mes:hover{border-color:var(--accent);color:var(--accent)}
.mes-label{font-size:15px;font-weight:600;color:#fff;min-width:130px;text-align:center}

/* TABS */
.tabs{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:12px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none;padding:16px;flex:1}
.tab-content.active{display:block}

/* CARDS INDICADOR */
.ind-grid{display:flex;flex-direction:column;gap:12px}
.ind-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.ind-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ind-label{font-size:14px;font-weight:600;color:#fff;flex:1;margin-right:8px;line-height:1.3}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-ouro{background:rgba(255,215,0,.15);color:var(--ouro);border:1px solid rgba(255,215,0,.3)}
.badge-prata{background:rgba(168,169,173,.15);color:var(--prata);border:1px solid rgba(168,169,173,.3)}
.badge-bronze{background:rgba(205,127,50,.15);color:var(--bronze);border:1px solid rgba(205,127,50,.3)}
.badge-fora{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.badge-nd{background:rgba(148,163,184,.1);color:var(--muted);border:1px solid var(--border)}
.ind-valor{font-size:26px;font-weight:700;color:#fff;margin-bottom:4px}
.ind-meta{font-size:12px;color:var(--muted)}
.ind-bonif{font-size:13px;font-weight:600;margin-top:8px}
.ind-bonif.bronze{color:var(--bronze)}
.ind-bonif.prata{color:var(--prata)}
.ind-bonif.ouro{color:var(--ouro)}
.ind-bonif.nd{color:var(--muted)}
.ind-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.ind-bar{height:100%;border-radius:2px;transition:width .6s}
.bar-ouro{background:var(--ouro)}
.bar-prata{background:var(--prata)}
.bar-bronze{background:var(--bronze)}
.bar-fora{background:var(--red)}

/* TOTAL BONIF */
.bonif-total{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.bonif-total-label{font-size:14px;color:var(--muted)}
.bonif-total-valor{font-size:22px;font-weight:700;color:var(--green)}

/* BOTÃO LANÇAR */
.btn-lancar{width:100%;background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;margin-top:4px}
.btn-lancar:active{transform:scale(.98)}
.btn-lancar.cicero{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;color:#fff}
.form-group{margin-bottom:16px}
.form-label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block;font-weight:500}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px;opacity:.7}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-salvar{width:100%;background:linear-gradient(135deg,var(--accent),#1d4ed8);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px}
.btn-salvar.cicero{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.btn-cancelar{width:100%;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:11px;font-size:14px;cursor:pointer;margin-top:8px}

/* DASHBOARD */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.kpi-val{font-size:22px;font-weight:700;color:var(--green)}
.kpi-val.blue{color:var(--accent)}
.kpi-val.purple{color:#a78bfa}
.kpi-val.yellow{color:var(--ouro)}
.kpi-label{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.nivel-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nivel-label{font-size:13px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nivel-badge{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:700;white-space:nowrap}
.placar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.placar-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.placar-row:last-child{border-bottom:none;font-weight:600}
.placar-key{color:var(--muted)}
.placar-val{color:#fff}

/* HISTÓRICO */
.hist-toggle{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:16px;gap:2px}
.hist-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:none;color:var(--muted);transition:.2s}
.hist-btn.active{background:var(--accent);color:#fff}
.hist-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--card2);color:var(--muted);font-weight:600;padding:10px 8px;text-align:left;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(255,255,255,.03)}
.hist-sel{display:flex;gap:10px;margin-bottom:14px}
.hist-sel select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}

/* CONFIG */
.config-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.config-section h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.config-row{margin-bottom:12px}
.config-row label{font-size:13px;color:var(--text);display:block;margin-bottom:5px}
.btn-config{background:var(--accent);border:none;border-radius:8px;color:#fff;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-config:hover{background:#2563eb}
.btn-config.danger{background:var(--red)}
.api-url{font-size:11px;word-break:break-all;color:var(--muted);background:#0f172a;padding:8px;border-radius:6px;margin-top:6px;user-select:all}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.meta-grid label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}

/* ABA CÍCERO no Arthur */
.cicero-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px;background:var(--card2);border-radius:10px}
.cicero-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}

/* SVG GRÁFICO */
.grafico-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
.grafico-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.grafico-legenda{display:flex;gap:16px;margin-top:8px;font-size:12px;flex-wrap:wrap}
.legenda-item{display:flex;align-items:center;gap:5px;color:var(--muted)}
.legenda-cor{width:12px;height:3px;border-radius:2px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#1e293b;border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;color:#fff;z-index:300;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:8px}

/* MODAL SENHA */
.modal-senha{max-width:320px;margin:auto;border-radius:16px;top:50%;transform:translateY(-50%);position:relative}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <img src="logo-jr.png" class="login-logo" alt="JR Joias"/>
  <h1>JR Cadastro</h1>
  <p class="login-sub">Indicadores de Desempenho</p>
  <div class="role-btns">
    <button class="role-btn active" id="role-arthur" onclick="selecionarRole('arthur')">📊 Arthur</button>
    <button class="role-btn" id="role-cicero" onclick="selecionarRole('cicero')">🔧 Cícero</button>
  </div>
  <div class="login-box">
    <input type="password" id="login-senha" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter')tentarLogin()"/>
    <button class="btn-gold" onclick="tentarLogin()">Entrar</button>
    <div class="login-err" id="login-erro"></div>
  </div>
  <div class="falcioni-footer">
    <img src="jr.png" alt="JR"/>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="header-title" id="header-title">JR Cadastro</div>
      <div class="header-sub" id="header-sub">Indicadores</div>
    </div>
    <div class="header-right">
      <button class="btn-lock" id="btn-lock" onclick="toggleLock()">🔒</button>
      <button class="btn-logout" onclick="logout()" title="Sair">⏻</button>
    </div>
  </header>

  <div class="mes-bar">
    <div class="mes-nav">
      <button class="btn-mes" onclick="mudarMes(-1)">‹</button>
      <span class="mes-label" id="mes-label">–</span>
      <button class="btn-mes" onclick="mudarMes(1)">›</button>
    </div>
    <div style="font-size:12px;color:var(--muted)" id="header-ano"></div>
  </div>

  <div class="tabs" id="tabs-bar"></div>

  <div id="tabs-content" style="flex:1;display:flex;flex-direction:column"></div>
</div>

<!-- MODAL LANÇAMENTO ARTHUR -->
<div class="modal-overlay" id="modal-arthur">
  <div class="modal">
    <div class="modal-title">📊 Lançar Indicadores — Arthur</div>
    <div id="form-arthur"></div>
    <button class="btn-salvar" onclick="salvarLancamento('arthur')">💾 Salvar</button>
    <button class="btn-cancelar" onclick="fecharModal('arthur')">Cancelar</button>
  </div>
</div>

<!-- MODAL LANÇAMENTO CÍCERO -->
<div class="modal-overlay" id="modal-cicero">
  <div class="modal">
    <div class="modal-title">🔧 Lançar Indicadores — Cícero</div>
    <div id="form-cicero"></div>
    <button class="btn-salvar cicero" onclick="salvarLancamento('cicero')">💾 Salvar</button>
    <button class="btn-cancelar" onclick="fecharModal('cicero')">Cancelar</button>
  </div>
</div>

<!-- MODAL SENHA LOCK -->
<div class="modal-overlay" id="modal-lock">
  <div class="modal modal-senha">
    <div class="modal-title">🔒 Senha Admin</div>
    <div class="form-group">
      <input type="password" id="lock-senha" placeholder="Senha admin..." onkeydown="if(event.key==='Enter')confirmarLock()"/>
    </div>
    <button class="btn-salvar" onclick="confirmarLock()">Confirmar</button>
    <button class="btn-cancelar" onclick="fecharModal('lock')">Cancelar</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, orderBy, addDoc, updateDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// ── CONFIG ──────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyDTqmtUcFa2EZTD304RYb_vb6BLvo9PknQ",
  authDomain: "jr-banho.firebaseapp.com",
  projectId: "jr-banho",
  storageBucket: "jr-banho.firebasestorage.app",
  messagingSenderId: "56470186011",
  appId: "1:56470186011:web:8853cada4d8b179868b0be"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── METAS ────────────────────────────────────────────────────────────────────
const METAS_ARTHUR_PADRAO = [
  { chave:'erro_cadastro',   label:'Erro de Cadastro (oc)',                tipo:'menor', unidade:'oc', bronze:3,  prata:2,  ouro:0,   bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
  { chave:'cadastros_realiz',label:'Cadastros Realizados (%)',             tipo:'maior', unidade:'%',  bronze:90, prata:95, ouro:100, bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
  { chave:'inovacao',        label:'Inovação e Criatividade (pt)',         tipo:'maior', unidade:'pt', bronze:2,  prata:3,  ouro:4,   bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
  { chave:'plano_desenv',    label:'Plano Desenvolvimento e Talentos (%)',tipo:'maior', unidade:'%',  bronze:85, prata:90, ouro:100, bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
  { chave:'checklist',       label:'Checklist de Rotina (%)',              tipo:'maior', unidade:'%',  bronze:85, prata:90, ouro:100, bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
  { chave:'ocorrencia',      label:'Ocorrência (oc)',                      tipo:'menor', unidade:'oc', bronze:3,  prata:2,  ouro:0,   bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
  { chave:'prazo_cadastro',  label:'Prazo Médio de Cadastro (h)',          tipo:'menor', unidade:'h',  bronze:48, prata:24, ouro:12,  bonif:{bronze:10.71,prata:12.86,ouro:21.43} },
];

const METAS_CICERO_PADRAO = [
  { chave:'atualizacao_cad', label:'Atualização de Cadastros (%)',         tipo:'maior', unidade:'%',  bronze:90, prata:95, ouro:100, bonif:{bronze:7.14,prata:10,ouro:14.29} },
  { chave:'tempo_atualizacao',label:'Tempo Médio de Atualização (h)',      tipo:'menor', unidade:'h',  bronze:48, prata:36, ouro:24,  bonif:{bronze:7.14,prata:10,ouro:14.29} },
  { chave:'erro_imagem',     label:'Índice de Erro de Imagem/Falta (%)',   tipo:'menor', unidade:'%',  bronze:3,  prata:2,  ouro:0,   bonif:{bronze:7.14,prata:10,ouro:14.29} },
  { chave:'os_executadas',   label:'Planejado x Executados — OS (%)',      tipo:'maior', unidade:'%',  bronze:90, prata:95, ouro:100, bonif:{bronze:7.14,prata:10,ouro:14.29} },
  { chave:'inovacao',        label:'Inovação e Criatividade (pt)',         tipo:'maior', unidade:'pt', bronze:2,  prata:3,  ouro:4,   bonif:{bronze:7.14,prata:10,ouro:14.29} },
  { chave:'manutencao_ti',   label:'Manutenção Preventiva de TI (%)',      tipo:'maior', unidade:'%',  bronze:90, prata:95, ouro:100, bonif:{bronze:7.14,prata:10,ouro:14.29} },
  { chave:'banco_dados',     label:'Atualização do Banco de Dados (%)',    tipo:'maior', unidade:'%',  bronze:90, prata:95, ouro:100, bonif:{bronze:7.14,prata:10,ouro:14.29} },
];

// ── ESTADO ───────────────────────────────────────────────────────────────────
let perfil = null; // 'arthur' | 'cicero'
let mesAtual = new Date().getMonth(); // 0-11
let anoAtual = new Date().getFullYear();
let senhas = { arthur:'arthur123', cicero:'cicero123', admin:'admin123' };
let metasArthur = JSON.parse(JSON.stringify(METAS_ARTHUR_PADRAO));
let metasCicero = JSON.parse(JSON.stringify(METAS_CICERO_PADRAO));
let lancamentosArthur = []; // do mês atual
let lancamentosCicero = [];
let lockAberto = false;
let tabAtiva = 0;

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmt(v, unidade) {
  if (v === null || v === undefined || isNaN(v)) return '–';
  if (unidade === '%') return v.toFixed(1) + '%';
  if (unidade === 'h') return v % 1 === 0 ? v + 'h' : v.toFixed(1) + 'h';
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function getNivel(meta, valor) {
  if (valor === null || valor === undefined || isNaN(valor)) return 'nd';
  const {tipo, bronze, prata, ouro} = meta;
  if (tipo === 'maior') {
    if (valor >= ouro) return 'ouro';
    if (valor >= prata) return 'prata';
    if (valor >= bronze) return 'bronze';
    return 'fora';
  } else {
    if (valor <= ouro) return 'ouro';
    if (valor <= prata) return 'prata';
    if (valor <= bronze) return 'bronze';
    return 'fora';
  }
}

function getBonif(meta, nivel) {
  if (nivel === 'nd' || nivel === 'fora') return 0;
  return meta.bonif[nivel] || 0;
}

function fmtBRL(v) {
  return 'R$ ' + v.toFixed(2).replace('.',',');
}

function lockVal(v) {
  if (!lockAberto) return '🔒 ••••';
  return v;
}

function agregaMes(lancamentos, chave) {
  // Para indicadores de média (%), usa avg; para contagem (oc, pt), usa sum; para tempo (h), usa avg
  const vals = lancamentos.map(l => l[chave]).filter(v => v !== null && v !== undefined && !isNaN(v));
  if (!vals.length) return null;
  return vals.reduce((a,b) => a+b, 0) / vals.length;
}

function agregaMesSum(lancamentos, chave) {
  const vals = lancamentos.map(l => l[chave]).filter(v => v !== null && v !== undefined && !isNaN(v));
  if (!vals.length) return null;
  return vals.reduce((a,b) => a+b, 0);
}

// Para cada indicador: oc e pt → sum; % e h → avg
function agregaIndicador(meta, lancamentos) {
  if (!lancamentos.length) return null;
  if (meta.unidade === 'oc' || meta.unidade === 'pt') {
    return agregaMesSum(lancamentos, meta.chave);
  }
  return agregaMes(lancamentos, meta.chave);
}

function toast(msg, tipo='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + tipo;
  setTimeout(() => t.className = 'toast', 2500);
}

// ── FIREBASE ──────────────────────────────────────────────────────────────────
async function carregarConfig() {
  try {
    const snap = await getDoc(doc(db, 'config', 'senhas_cadastro'));
    if (snap.exists()) senhas = { ...senhas, ...snap.data() };
    const snapA = await getDoc(doc(db, 'config', 'metas_arthur'));
    if (snapA.exists()) {
      const d = snapA.data();
      metasArthur = metasArthur.map(m => d[m.chave] ? { ...m, ...d[m.chave], bonif: m.bonif } : m);
    }
    const snapC = await getDoc(doc(db, 'config', 'metas_cicero'));
    if (snapC.exists()) {
      const d = snapC.data();
      metasCicero = metasCicero.map(m => d[m.chave] ? { ...m, ...d[m.chave], bonif: m.bonif } : m);
    }
  } catch(e) { console.warn('Config:', e); }
}

async function carregarLancamentos(quem) {
  const col = quem === 'arthur' ? 'lancamentos_arthur' : 'lancamentos_cicero';
  try {
    const q = query(collection(db, col),
      where('mes', '==', mesAtual),
      where('ano', '==', anoAtual),
      orderBy('data', 'asc'));
    const snap = await getDocs(q);
    const dados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (quem === 'arthur') lancamentosArthur = dados;
    else lancamentosCicero = dados;
    return dados;
  } catch(e) { console.warn('Lançamentos:', e); return []; }
}

async function carregarLancamentosMes(quem, mes, ano) {
  const col = quem === 'arthur' ? 'lancamentos_arthur' : 'lancamentos_cicero';
  try {
    const q = query(collection(db, col),
      where('mes', '==', mes),
      where('ano', '==', ano),
      orderBy('data', 'asc'));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { return []; }
}

async function carregarLancamentosAno(quem, ano) {
  const col = quem === 'arthur' ? 'lancamentos_arthur' : 'lancamentos_cicero';
  try {
    const q = query(collection(db, col), where('ano', '==', ano), orderBy('data', 'asc'));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { return []; }
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
let roleSelecionado = 'arthur';

window.selecionarRole = function(role) {
  roleSelecionado = role;
  document.getElementById('role-arthur').classList.toggle('active', role === 'arthur');
  document.getElementById('role-cicero').classList.toggle('active', role === 'cicero');
  document.getElementById('login-senha').value = '';
  document.getElementById('login-erro').textContent = '';
};

window.tentarLogin = async function() {
  const tipo = roleSelecionado;
  const senha = document.getElementById('login-senha').value.trim();
  const erroEl = document.getElementById('login-erro');
  erroEl.textContent = '';
  if (senha !== senhas[tipo]) {
    erroEl.textContent = 'Senha incorreta.';
    return;
  }
  perfil = tipo;
  lockAberto = false;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('header-title').textContent = tipo === 'arthur' ? '📊 Arthur' : '🔧 Cícero';
  document.getElementById('header-sub').textContent = 'JR Cadastro';
  atualizarMesLabel();
  await carregarLancamentos('arthur');
  await carregarLancamentos('cicero');
  renderTabs();
  renderTab(0);
};

window.logout = function() {
  perfil = null;
  lockAberto = false;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-senha').value = '';
  document.getElementById('login-erro').style.display = 'none';
  document.getElementById('btn-lock').textContent = '🔒';
};

// ── MÊS ───────────────────────────────────────────────────────────────────────
function atualizarMesLabel() {
  document.getElementById('mes-label').textContent = MESES[mesAtual];
  document.getElementById('header-ano').textContent = anoAtual;
}

window.mudarMes = async function(delta) {
  mesAtual += delta;
  if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
  if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
  atualizarMesLabel();
  await carregarLancamentos('arthur');
  await carregarLancamentos('cicero');
  renderTab(tabAtiva);
};

// ── LOCK ──────────────────────────────────────────────────────────────────────
window.toggleLock = function() {
  if (lockAberto) {
    lockAberto = false;
    document.getElementById('btn-lock').textContent = '🔒';
    renderTab(tabAtiva);
  } else {
    document.getElementById('lock-senha').value = '';
    document.getElementById('modal-lock').classList.add('open');
  }
};

window.confirmarLock = function() {
  const s = document.getElementById('lock-senha').value.trim();
  if (s !== senhas.admin) { toast('Senha incorreta', 'error'); return; }
  lockAberto = true;
  document.getElementById('btn-lock').textContent = '🔓';
  fecharModal('lock');
  renderTab(tabAtiva);
};

// ── TABS ──────────────────────────────────────────────────────────────────────
function getTabsConfig() {
  if (perfil === 'arthur') {
    return [
      { id:'ind',  label:'📊 Indicadores', render: renderIndicadoresArthur },
      { id:'dash', label:'📈 Dashboard',   render: renderDashboard },
      { id:'cic',  label:'🔧 Cícero',      render: renderCiceroView },
      { id:'hist', label:'📅 Histórico',   render: renderHistorico },
      { id:'cfg',  label:'⚙️ Config',      render: renderConfig },
    ];
  } else {
    return [
      { id:'ind',  label:'📊 Indicadores', render: renderIndicadoresCicero },
      { id:'hist', label:'📅 Histórico',   render: renderHistorico },
    ];
  }
}

function renderTabs() {
  const tabs = getTabsConfig();
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = tabs.map((t,i) =>
    `<div class="tab${i===tabAtiva?' active':''}" onclick="switchTab(${i})">${t.label}</div>`
  ).join('');
  const cont = document.getElementById('tabs-content');
  cont.innerHTML = tabs.map((t,i) =>
    `<div class="tab-content${i===tabAtiva?' active':''}" id="tc-${i}"></div>`
  ).join('');
}

window.switchTab = function(i) {
  tabAtiva = i;
  document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', j===i));
  document.querySelectorAll('.tab-content').forEach((t,j) => t.classList.toggle('active', j===i));
  renderTab(i);
};

function renderTab(i) {
  const tabs = getTabsConfig();
  if (tabs[i]) tabs[i].render(document.getElementById('tc-' + i));
}

// ── INDICADORES ARTHUR ────────────────────────────────────────────────────────
function renderIndicadoresArthur(el) {
  const metas = metasArthur;
  let totalBonif = 0;
  const cardsHTML = metas.map(m => {
    const v = agregaIndicador(m, lancamentosArthur);
    const nivel = getNivel(m, v);
    const bonif = getBonif(m, nivel);
    totalBonif += bonif;
    return cardHTML(m, v, nivel, bonif);
  }).join('');

  el.innerHTML = `
    <div class="ind-grid">
      <div class="bonif-total">
        <div>
          <div class="bonif-total-label">Bonificação Total — ${MESES[mesAtual]}</div>
          <div style="font-size:12px;color:var(--muted)">${lancamentosArthur.length} lançamento(s)</div>
        </div>
        <div class="bonif-total-valor">${lockVal(fmtBRL(totalBonif))}</div>
      </div>
      ${cardsHTML}
      <button class="btn-lancar" onclick="abrirModal('arthur')">+ Lançar Hoje</button>
    </div>`;
}

// ── INDICADORES CÍCERO ────────────────────────────────────────────────────────
function renderIndicadoresCicero(el) {
  const metas = metasCicero;
  let totalBonif = 0;
  const cardsHTML = metas.map(m => {
    const v = agregaIndicador(m, lancamentosCicero);
    const nivel = getNivel(m, v);
    const bonif = getBonif(m, nivel);
    totalBonif += bonif;
    return cardHTML(m, v, nivel, bonif);
  }).join('');

  el.innerHTML = `
    <div class="ind-grid">
      <div class="bonif-total">
        <div>
          <div class="bonif-total-label">Bonificação Total — ${MESES[mesAtual]}</div>
          <div style="font-size:12px;color:var(--muted)">${lancamentosCicero.length} lançamento(s)</div>
        </div>
        <div class="bonif-total-valor">${lockVal(fmtBRL(totalBonif))}</div>
      </div>
      ${cardsHTML}
      <button class="btn-lancar cicero" onclick="abrirModal('cicero')">+ Lançar Hoje</button>
    </div>`;
}

function cardHTML(m, v, nivel, bonif) {
  const badgeClass = `badge badge-${nivel}`;
  const badgeLabel = nivel === 'nd' ? '–' : nivel === 'fora' ? 'Fora da Meta' : nivel.charAt(0).toUpperCase()+nivel.slice(1);
  const barPct = calcBarPct(m, v);
  const barClass = nivel === 'nd' ? '' : `bar-${nivel}`;
  const bonifStr = nivel === 'nd' || nivel === 'fora' ? '–' : lockVal(fmtBRL(bonif));
  const bonifClass = nivel === 'nd' || nivel === 'fora' ? 'nd' : nivel;
  return `
  <div class="ind-card">
    <div class="ind-card-top">
      <div class="ind-label">${m.label}</div>
      <span class="${badgeClass}">${badgeLabel}</span>
    </div>
    <div class="ind-valor">${fmt(v, m.unidade)}</div>
    <div class="ind-meta">${metaStr(m)}</div>
    <div class="ind-bonif ${bonifClass}">${nivel !== 'nd' && nivel !== 'fora' ? '💰 ' : ''}${bonifStr}</div>
    <div class="ind-bar-wrap"><div class="ind-bar ${barClass}" style="width:${barPct}%"></div></div>
  </div>`;
}

function metaStr(m) {
  if (m.tipo === 'maior') return `Bronze ≥${fmt(m.bronze, m.unidade)} · Prata ≥${fmt(m.prata, m.unidade)} · Ouro ${fmt(m.ouro, m.unidade)}`;
  return `Bronze ≤${fmt(m.bronze, m.unidade)} · Prata ≤${fmt(m.prata, m.unidade)} · Ouro ${fmt(m.ouro, m.unidade)}`;
}

function calcBarPct(m, v) {
  if (v === null || isNaN(v)) return 0;
  const nivel = getNivel(m, v);
  if (nivel === 'ouro') return 100;
  if (nivel === 'prata') return 75;
  if (nivel === 'bronze') return 50;
  return 20;
}

// ── MODAL LANÇAMENTO ──────────────────────────────────────────────────────────
window.abrirModal = function(quem) {
  const metas = quem === 'arthur' ? metasArthur : metasCicero;
  const formEl = document.getElementById('form-' + quem);
  formEl.innerHTML = metas.map(m => `
    <div class="form-group">
      <label class="form-label">${m.label}</label>
      <input type="number" id="inp-${quem}-${m.chave}" placeholder="0"
        step="${m.unidade==='%'||m.unidade==='h'?'0.1':'1'}" min="0"/>
      <div class="form-hint">${m.unidade === '%' ? 'Valor em % (0 a 100)' : m.unidade === 'h' ? 'Valor em horas' : m.unidade === 'oc' ? 'Número de ocorrências' : 'Pontuação (0–10)'}</div>
    </div>`).join('');
  document.getElementById('modal-' + quem).classList.add('open');
};

window.fecharModal = function(quem) {
  document.getElementById('modal-' + quem).classList.remove('open');
};

window.salvarLancamento = async function(quem) {
  const metas = quem === 'arthur' ? metasArthur : metasCicero;
  const agora = new Date();
  const data = {
    data: agora.toISOString().slice(0,10),
    mes: mesAtual,
    ano: anoAtual,
    timestamp: agora.getTime(),
  };
  metas.forEach(m => {
    const inp = document.getElementById(`inp-${quem}-${m.chave}`);
    data[m.chave] = inp && inp.value !== '' ? parseFloat(inp.value) : null;
  });
  try {
    const col = quem === 'arthur' ? 'lancamentos_arthur' : 'lancamentos_cicero';
    await addDoc(collection(db, col), data);
    toast('Lançamento salvo!', 'success');
    fecharModal(quem);
    await carregarLancamentos(quem);
    renderTab(tabAtiva);
  } catch(e) { toast('Erro ao salvar', 'error'); }
};

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
async function renderDashboard(el) {
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  const mA = metasArthur, mC = metasCicero;

  function calcBonifTotal(metas, lancs) {
    return metas.reduce((s, m) => {
      const v = agregaIndicador(m, lancs);
      return s + getBonif(m, getNivel(m, v));
    }, 0);
  }
  function calcPctOuro(metas, lancs) {
    if (!lancs.length) return 0;
    const em_ouro = metas.filter(m => getNivel(m, agregaIndicador(m, lancs)) === 'ouro').length;
    return Math.round(em_ouro / metas.length * 100);
  }

  const bA = calcBonifTotal(mA, lancamentosArthur);
  const bC = calcBonifTotal(mC, lancamentosCicero);
  const pOA = calcPctOuro(mA, lancamentosArthur);
  const pOC = calcPctOuro(mC, lancamentosCicero);

  const niveisArthur = mA.map(m => ({ label: m.label, nivel: getNivel(m, agregaIndicador(m, lancamentosArthur)) }));
  const niveisCicero = mC.map(m => ({ label: m.label, nivel: getNivel(m, agregaIndicador(m, lancamentosCicero)) }));

  // Gráfico anual
  const dadosAno = await Promise.all(
    Array.from({length:12},(_,i) => Promise.all([
      carregarLancamentosMes('arthur', i, anoAtual),
      carregarLancamentosMes('cicero', i, anoAtual)
    ]))
  );
  const grafA = dadosAno.map(([la]) => calcBonifTotal(mA, la));
  const grafC = dadosAno.map(([,lc]) => calcBonifTotal(mC, lc));

  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val blue">${lockVal(fmtBRL(bA))}</div><div class="kpi-label">Bonif. Arthur</div></div>
      <div class="kpi-card"><div class="kpi-val purple">${lockVal(fmtBRL(bC))}</div><div class="kpi-label">Bonif. Cícero</div></div>
      <div class="kpi-card"><div class="kpi-val">${lockVal(fmtBRL(bA+bC))}</div><div class="kpi-label">Total Geral</div></div>
      <div class="kpi-card"><div class="kpi-val yellow">${pOA}% / ${pOC}%</div><div class="kpi-label">Em Ouro A/C</div></div>
    </div>
    <div class="section-title">Níveis — Arthur</div>
    <div class="placar" style="margin-bottom:16px">${niveisArthur.map(n => niveisRow(n)).join('')}</div>
    <div class="section-title">Níveis — Cícero</div>
    <div class="placar" style="margin-bottom:16px">${niveisCicero.map(n => niveisRow(n)).join('')}</div>
    <div class="grafico-wrap">
      <div class="grafico-title">📈 Bonificação Anual ${anoAtual}</div>
      ${svgGrafico(grafA, grafC)}
      <div class="grafico-legenda">
        <div class="legenda-item"><div class="legenda-cor" style="background:var(--accent)"></div>Arthur</div>
        <div class="legenda-item"><div class="legenda-cor" style="background:#a78bfa"></div>Cícero</div>
      </div>
    </div>`;
}

function niveisRow({label, nivel}) {
  const classes = {ouro:'badge-ouro',prata:'badge-prata',bronze:'badge-bronze',fora:'badge-fora',nd:'badge-nd'};
  const labels = {ouro:'Ouro',prata:'Prata',bronze:'Bronze',fora:'Fora',nd:'–'};
  const short = label.replace(/\s*\(.*\)/, '');
  return `<div class="nivel-row"><span class="nivel-label">${short}</span><span class="badge ${classes[nivel]}">${labels[nivel]}</span></div>`;
}

function svgGrafico(serA, serC) {
  const W=320, H=120, PAD=20, BOTTOM=20;
  const maxV = Math.max(...serA, ...serC, 1);
  const pts = (ser) => ser.map((v,i) => {
    const x = PAD + i * (W - PAD*2) / 11;
    const y = PAD + (1 - v/maxV) * (H - PAD - BOTTOM);
    return `${x},${y}`;
  }).join(' ');
  const mesLabels = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const labels = mesLabels.map((l,i) => {
    const x = PAD + i * (W - PAD*2) / 11;
    return `<text x="${x}" y="${H-4}" fill="#475569" font-size="9" text-anchor="middle">${l}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <polyline fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round" points="${pts(serA)}"/>
    <polyline fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" points="${pts(serC)}"/>
    ${labels}
  </svg>`;
}

// ── HISTÓRICO ─────────────────────────────────────────────────────────────────
let histModo = 'mensal';
let histMesSel = new Date().getMonth();
let histAnoSel = new Date().getFullYear();

async function renderHistorico(el) {
  el.innerHTML = `
    <div class="hist-toggle">
      <button class="hist-btn ${histModo==='mensal'?'active':''}" onclick="switchHistModo('mensal')">📅 Mensal</button>
      <button class="hist-btn ${histModo==='diario'?'active':''}" onclick="switchHistModo('diario')">📆 Diário</button>
    </div>
    <div id="hist-body"><div class="loading"><div class="spinner"></div>Carregando...</div></div>`;
  await renderHistBody(el);
}

window.switchHistModo = async function(modo) {
  histModo = modo;
  renderTab(tabAtiva);
};

async function renderHistBody(elParent) {
  const el = document.getElementById('hist-body');
  if (!el) return;
  const quem = perfil;
  const metas = quem === 'arthur' ? metasArthur : metasCicero;

  if (histModo === 'mensal') {
    el.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
    const lancsAno = await carregarLancamentosAno(quem, histAnoSel);
    const anos = [histAnoSel-1, histAnoSel, histAnoSel+1];
    let rows = '';
    for (let m=0; m<12; m++) {
      const lancs = lancsAno.filter(l => l.mes === m);
      const bonif = metas.reduce((s, mt) => {
        const v = agregaIndicador(mt, lancs);
        return s + getBonif(mt, getNivel(mt, v));
      }, 0);
      const niveis = metas.map(mt => getNivel(mt, agregaIndicador(mt, lancs)));
      const ouroCount = niveis.filter(n => n==='ouro').length;
      const pctOuro = lancs.length ? Math.round(ouroCount/metas.length*100) : 0;
      rows += `<tr>
        <td>${MESES[m]}</td>
        <td>${lancs.length}</td>
        <td>${pctOuro}%</td>
        <td>${lockVal(fmtBRL(bonif))}</td>
      </tr>`;
    }
    el.innerHTML = `
      <div class="hist-sel">
        <select onchange="histAnoSel=parseInt(this.value);switchHistModo('mensal')">
          ${anos.map(a => `<option value="${a}"${a===histAnoSel?' selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      <div class="hist-table-wrap">
        <table>
          <thead><tr><th>Mês</th><th>Lançamentos</th><th>% Ouro</th><th>Bonif.</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } else {
    // Diário
    el.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
    const lancs = await carregarLancamentosMes(quem, histMesSel, histAnoSel);
    const anos = [histAnoSel-1, histAnoSel, histAnoSel+1];
    const mesesOpts = MESES.map((m,i) => `<option value="${i}"${i===histMesSel?' selected':''}>${m}</option>`).join('');
    const anosOpts = anos.map(a => `<option value="${a}"${a===histAnoSel?' selected':''}>${a}</option>`).join('');
    let rows = '';
    lancs.forEach(l => {
      const bonif = metas.reduce((s, m) => s + getBonif(m, getNivel(m, l[m.chave])), 0);
      rows += `<tr>
        <td>${l.data||'–'}</td>
        <td>${metas.map(m => fmt(l[m.chave], m.unidade)).join(' / ')}</td>
        <td>${lockVal(fmtBRL(bonif))}</td>
      </tr>`;
    });
    if (!lancs.length) rows = `<tr><td colspan="3" style="text-align:center;color:var(--muted)">Sem lançamentos</td></tr>`;
    el.innerHTML = `
      <div class="hist-sel">
        <select onchange="histMesSel=parseInt(this.value);switchHistModo('diario')">${mesesOpts}</select>
        <select onchange="histAnoSel=parseInt(this.value);switchHistModo('diario')">${anosOpts}</select>
      </div>
      <div class="hist-table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Valores</th><th>Bonif.</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }
}

window.salvarSenhas = async function() {
  const a = document.getElementById('cfg-senha-arthur').value.trim();
  const c = document.getElementById('cfg-senha-cicero').value.trim();
  const adm = document.getElementById('cfg-senha-admin').value.trim();
  if (a) senhas.arthur = a;
  if (c) senhas.cicero = c;
  if (adm) senhas.admin = adm;
  try {
    await setDoc(doc(db, 'config', 'senhas_cadastro'), senhas);
    toast('Senhas salvas!', 'success');
  } catch(e) { toast('Erro ao salvar', 'error'); }
};

window.salvarMetas = async function(quem) {
  const metas = quem === 'arthur' ? metasArthur : metasCicero;
  const prefix = quem === 'arthur' ? 'ma' : 'mc';
  const obj = {};
  metas.forEach(m => {
    const b = parseFloat(document.getElementById(`${prefix}-bronze-${m.chave}`)?.value);
    const p = parseFloat(document.getElementById(`${prefix}-prata-${m.chave}`)?.value);
    const o = parseFloat(document.getElementById(`${prefix}-ouro-${m.chave}`)?.value);
    m.bronze = isNaN(b) ? m.bronze : b;
    m.prata  = isNaN(p) ? m.prata  : p;
    m.ouro   = isNaN(o) ? m.ouro   : o;
    obj[m.chave] = { bronze: m.bronze, prata: m.prata, ouro: m.ouro };
  });
  try {
    const docKey = quem === 'arthur' ? 'metas_arthur' : 'metas_cicero';
    await setDoc(doc(db, 'config', docKey), obj);
    toast(`Metas de ${quem === 'arthur' ? 'Arthur' : 'Cícero'} salvas!`, 'success');
  } catch(e) { toast('Erro ao salvar', 'error'); }
};
